name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run build:packages
      - run: pnpm run test
      - run: pnpm run guard
      - run: pnpm --filter colophon-web exec tsc --noEmit
      - run: pnpm --filter colophon-web run build
